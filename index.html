<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biblioteca Digital - Mi Colección de Libros</title>
  <!-- Color para la barra del navegador móvil -->
  <meta name="theme-color" content="#0d1117">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131b2e;
      --card-hover: #1c2744;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #10b981; /* Verde esmeralda literario */
      --accent-hover: #059669;
      --border: rgba(255, 255, 255, 0.08);
      --glass-bg: rgba(19, 27, 46, 0.85);
      --radius: 12px;
      --gold: #f59e0b;
      
      /* Nuevos colores para diferenciar el Autor */
      --author-bg: #1a233a;
      --author-border: rgba(16, 185, 129, 0.3);
      --book-bg: #0d1526;
      --book-hover: #16223b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { 
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
      background: var(--bg); 
      color: var(--text); 
      padding: 16px 12px;
      min-height: 100vh;
    }
    
    .container { max-width: 900px; margin: 0 auto; }

    /* Header de la Biblioteca */
    .header-title {
      text-align: center;
      margin-bottom: 20px;
      padding: 10px 0;
    }
    .header-title h1 {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .header-title p {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Panel de Controles Fijo con Glassmorphism */
    .controls {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 16px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      margin-bottom: 20px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      position: sticky;
      top: 10px;
      z-index: 10;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.6);
    }

    .controls input, .controls select {
      background: #090d16;
      color: var(--text);
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }

    .controls input:focus, .controls select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.25);
    }

    .search-input { flex: 1 1 100%; }
    .filter-select { flex: 1 1 100%; }

    .counter {
      width: 100%;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 2px;
      font-weight: 500;
    }

    /* Estilo del Contenedor Principal por Autor */
    .author-accordion {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 16px;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }

    /* ESTILO DESTACADO: Tarjeta / Encabezado del Autor */
    .author-header {
      width: 100%;
      padding: 18px 20px;
      background: var(--author-bg);
      border: none;
      border-left: 4px solid var(--accent); /* Línea verde distintiva */
      text-align: left;
      font-size: 1.15rem;
      font-weight: 700;
      color: #ffffff;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.2s;
    }

    .author-header:hover {
      background: #222d4a;
    }

    .author-badge {
      font-size: 0.8rem;
      font-weight: 600;
      color: #6ee7b7;
      background: rgba(16, 185, 129, 0.15);
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    /* Área interior donde van las tarjetas de libros */
    .author-content {
      display: none;
      padding: 18px;
      border-top: 1px solid var(--border);
      background: rgba(6, 9, 15, 0.8); /* Fondo más oscuro para contrastar las obras */
    }

    .author-content.open { display: block; }

    /* Rejilla de Tarjetas de Libros */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 14px;
    }

    /* ESTILO DIFERENCIADO: Tarjetas de los Libros */
    .card {
      background: var(--book-bg);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      padding: 14px;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.2s ease;
      position: relative;
    }

    .card:hover {
      transform: translateY(-3px);
      background: var(--book-hover);
      border-color: rgba(16, 185, 129, 0.4);
      box-shadow: 0 6px 12px rgba(0,0,0,0.5);
    }

    .card-title {
      font-weight: 500;
      font-size: 0.92rem;
      margin-bottom: 12px;
      line-height: 1.4;
      color: #e2e8f0;
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      color: var(--text-muted);
      border-top: 1px dashed rgba(255, 255, 255, 0.06);
      padding-top: 8px;
    }

    .tag-format {
      background: rgba(245, 158, 11, 0.12);
      color: var(--gold);
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 0.72rem;
      border: 1px solid rgba(245, 158, 11, 0.2);
    }

    .card-action {
      color: var(--accent);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .load-more-btn {
      display: block;
      width: 100%;
      margin-top: 16px;
      padding: 12px;
      background: rgba(16, 185, 129, 0.08);
      border: 1px dashed var(--accent);
      color: #6ee7b7;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }

    .load-more-btn:hover {
      background: var(--accent);
      color: #fff;
    }

    .empty-msg {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-title">
      <h1>📚 Biblioteca Digital</h1>
      <p>Catálogo interactivo de libros y obras literarias</p>
    </div>

    <div class="controls">
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 Buscar por título de libro o autor...">
      
      <select id="authorSelect" class="filter-select">
        <option value="">Todos los autores</option>
      </select>

      <div class="counter" id="counter">Cargando libros_extraidos.txt...</div>
    </div>

    <div id="gallery"></div>
  </div>

  <script>
    let rawData = [];
    const PAGE_SIZE = 8;
    const pageState = {};

    function normalizeText(text) {
      return text
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
    }

    async function loadData() {
      try {
        const res = await fetch('libros_extraidos.txt');
        const text = await res.text();
        
        rawData = text
          .split('\n')
          .map(line => line.trim())
          .filter(line => line.length > 0 && !line.startsWith('Autor del libro'))
          .map(line => {
            const parts = line.split('|').map(item => item.trim());
            const autorNombre = parts[0] ? parts[0] : 'Autor Anónimo / Varios';
            return {
              autor: autorNombre,
              titulo: parts[1] || 'Sin título',
              link: parts[2] || '#'
            };
          })
          .filter(item => item.link.startsWith('http'));

        populateAuthorSelect();
        render();
      } catch (err) {
        document.getElementById('counter').innerText = 'Error al cargar el archivo libros_extraidos.txt';
      }
    }

    function populateAuthorSelect() {
      const authorSelect = document.getElementById('authorSelect');
      const authors = [...new Set(rawData.map(d => d.autor))].sort((a, b) => a.localeCompare(b));
      
      authors.forEach(author => {
        const opt = document.createElement('option');
        opt.value = author;
        opt.textContent = author;
        authorSelect.appendChild(opt);
      });
    }

    function render() {
      const search = normalizeText(document.getElementById('searchInput').value);
      const selectedAuthor = document.getElementById('authorSelect').value;

      const filtered = rawData.filter(item => {
        const titleNormalized = normalizeText(item.titulo);
        const authorNormalized = normalizeText(item.autor);
        
        const matchesSearch = titleNormalized.includes(search) || authorNormalized.includes(search);
        const matchesAuthor = !selectedAuthor || item.autor === selectedAuthor;
        
        return matchesSearch && matchesAuthor;
      });

      document.getElementById('counter').innerText = `Mostrando ${filtered.length} de ${rawData.length} libros disponibles`;

      const gallery = document.getElementById('gallery');
      gallery.innerHTML = '';

      if (filtered.length === 0) {
        gallery.innerHTML = '<div class="empty-msg">📖 No se encontraron libros con los criterios seleccionados.</div>';
        return;
      }

      const grouped = filtered.reduce((acc, item) => {
        acc[item.autor] = acc[item.autor] || [];
        acc[item.autor].push(item);
        return acc;
      }, {});

      const sortedAuthors = Object.keys(grouped).sort((a, b) => a.localeCompare(b));

      sortedAuthors.forEach((author, index) => {
        const accordion = document.createElement('div');
        accordion.className = 'author-accordion';

        const forceOpen = search.length > 0 || selectedAuthor !== "";
        const isOpen = forceOpen || (index === 0 && !pageState.hasOwnProperty(author)) || pageState[author]?.open;

        const limit = pageState[author]?.limit || PAGE_SIZE;
        const totalInAuthor = grouped[author].length;
        const visibleItems = grouped[author].slice(0, limit);

        accordion.innerHTML = `
          <button class="author-header" onclick="toggleAuthor('${author.replace(/'/g, "\\'")}')">
            <span>👤 ${author}</span>
            <span class="author-badge">${totalInAuthor} ${totalInAuthor === 1 ? 'libro' : 'libros'}</span>
          </button>

          <div class="author-content ${isOpen ? 'open' : ''}">
            <div class="grid">
              ${visibleItems.map(item => `
                <a class="card" href="${item.link}" target="_blank" rel="noopener">
                  <div class="card-title">📖 ${item.titulo}</div>
                  <div class="card-meta">
                    <span class="tag-format">Digital</span>
                    <span class="card-action">Descargar ⬇</span>
                  </div>
                </a>
              `).join('')}
            </div>
            ${limit < totalInAuthor ? `
              <button class="load-more-btn" onclick="loadMore('${author.replace(/'/g, "\\'")}')">
                Ver más libros de este autor (+${Math.min(PAGE_SIZE, totalInAuthor - limit)})
              </button>
            ` : ''}
          </div>
        `;

        gallery.appendChild(accordion);
      });
    }

    window.toggleAuthor = function(author) {
      pageState[author] = pageState[author] || { limit: PAGE_SIZE, open: false };
      pageState[author].open = !pageState[author].open;
      render();
    };

    window.loadMore = function(author) {
      pageState[author] = pageState[author] || { limit: PAGE_SIZE, open: true };
      pageState[author].limit += PAGE_SIZE;
      pageState[author].open = true;
      render();
    };

    document.getElementById('searchInput').addEventListener('input', render);
    document.getElementById('authorSelect').addEventListener('change', render);

    loadData();
  </script>
</body>
</html>
